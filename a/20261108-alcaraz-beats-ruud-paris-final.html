<h1 class="article-title">艾卡拿斯直落兩盤挫魯迪　首闖巴黎大師賽決賽鬥舒爾頓</h1>
<p class="lead article-summary">二號種子、世界排名第三的西班牙球手艾卡拿斯，在巴黎大師賽男單四強以6:4、6:4直落兩盤擊敗挪威的魯迪，首次打入巴黎大師賽決賽，全場僅用1小時27分鐘。艾卡拿斯全場未曾面對破發點，在第二個賽點以發球直得鎖定勝局，連勝場數增至八場。星期日的決賽他將迎戰舒爾頓，兩人繼美網八強後再度交鋒，當時由舒爾頓勝出；艾卡拿斯在對賽往績仍以3勝1負領先。</p>
