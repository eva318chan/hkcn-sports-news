<p class="lead article-summary">法國在波爾多以2:1擊敗土耳其，以13分贏得歐國聯A1組首名，晉級八強。土耳其守將托普古在50分鐘擺烏龍，加上小將古魯比在80分鐘射入處子國際賽入球，助法國奠定勝局，巴達斯在90分鐘為土耳其追回一球。同日A3組克羅地亞在奧西耶克以2:1擊敗捷克，馬耶爾尾段入球助球隊完成對捷克的雙殺，並終止在歐國聯的四連敗。</p>
