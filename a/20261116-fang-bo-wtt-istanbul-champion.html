<h1 class="article-title">34歲方博4:1挫姜東秀 復出首奪WTT伊斯坦布爾站冠軍</h1>
<p class="lead article-summary">世界乒乓球職業大聯盟常規挑戰賽伊斯坦布爾站結束。代表哈薩克隊參賽的老將方博，在男單決賽中以4:1擊敗韓國選手姜東秀，獲得復出後的首個冠軍。現年34歲的方博曾經隨國乒男隊，奪得2015年團體世界盃及2016年世乒賽團體賽冠軍。方博在2021年退役，今年4月宣布復出，代表哈薩克隊出戰，但不會參加國際三大賽，即是奧運會、世乒賽及世界盃。</p>

}

document.documentElement.lang = LANG==='en'?'en':(LANG==='zh_hans'?'zh-CN':'zh-Hant');

tags.innerHTML=h;
